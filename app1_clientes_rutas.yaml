    // Nombres de tablas en Excel

    const NOMBRE_TABLA_EXCEL = "Datos_Clientes";

    const NOMBRE_TABLA_RUTA = "Ruta_Generada";


    // Dataset inicial (Espejo de clientes_demo.csv para inicialización
