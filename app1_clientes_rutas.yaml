        ciudad: "Madrid",
        lat: 40.425,
        lng: -3.691,
        zona: "Centro",
        venta: 9800,
        prioridad: "Media",
      },
      {
        id: "CLI-007",
        nombre: "Cafetería Plaza Mayor",
        contacto: "Javier Santos",
        ciudad: "Madrid",
        lat: 40.4155,
        lng: -3.7074,
        zona: "Centro",
        venta: 5400,
        prioridad: "Baja",
      },
      {
        id: "CLI-008",
